steps:
  # 1. Pull previous image for Docker layer caching
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull asia-south1-docker.pkg.dev/ai-yashcom/cloud-run-source-deploy/los-next:latest || exit 0

  # 2. Build image with BuildKit and inline layer cache
  - name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '--cache-from'
      - 'asia-south1-docker.pkg.dev/ai-yashcom/cloud-run-source-deploy/los-next:latest'
      - '-t'
      - 'asia-south1-docker.pkg.dev/ai-yashcom/cloud-run-source-deploy/los-next:latest'
      - '--label'
      - 'org.opencontainers.image.description=YASHCOM Learning OS (los-next)'
      - '--label'
      - 'org.opencontainers.image.revision=$SHORT_SHA'
      - '.'

  # 3. Push latest tag to Artifact Registry (overwrites existing image to stay within 0.5 GB free tier)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/ai-yashcom/cloud-run-source-deploy/los-next:latest'

  # 4. Deploy container to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'los-next'
      - '--image'
      - 'asia-south1-docker.pkg.dev/ai-yashcom/cloud-run-source-deploy/los-next:latest'
      - '--region'
      - 'asia-south1'
      - '--allow-unauthenticated'

  # 5. Automatically prune untagged/old container images from Artifact Registry to stay within 0.5 GB free tier
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Pruning untagged container image digests from Artifact Registry to preserve 0.5 GB free tier..."
        UNTAGGED_DIGESTS=$$(gcloud artifacts docker images list asia-south1-docker.pkg.dev/ai-yashcom/cloud-run-source-deploy/los-next --filter="NOT tags:*" --format="get(version)" 2>/dev/null || true)
        for digest in $$UNTAGGED_DIGESTS; do
          echo "Deleting untagged image digest: $$digest"
          gcloud artifacts docker images delete "asia-south1-docker.pkg.dev/ai-yashcom/cloud-run-source-deploy/los-next@$$digest" --delete-tags --quiet || true
        done
        echo "Artifact Registry storage prune complete."

options:
  logging: 'CLOUD_LOGGING_ONLY'
